name: CI

# The gates this project has always had, run by a machine instead of by hand.
#
# Every job below was previously a command someone remembered to type. The one
# that matters most is `-race`: a data race in `pattern` validation shipped and
# survived for months because nothing ran the race detector over a schema that
# used a pattern (docs/decisions/0009-shared-compiled-state.md D1).
#
# ── PREREQUISITE ────────────────────────────────────────────────────────────
# Every job needs the conformance corpus, and the corpus repository is private
# while this one is public. A workflow's default token reads only its own
# repository, so without one of the two fixes below EVERY job fails at the
# checkout with a bare "Not Found":
#
#   1. make maniartech/InternetObject-test-cases public, or
#   2. add a CORPUS_TOKEN repository secret with read access to it.
#
# Nothing else in this file can compensate: the corpus IS the definition of
# done, and internal/conformance fails rather than skips when it is missing,
# deliberately. Note that (2) also leaves outside contributors unable to run the
# gate that decides whether their change is correct.

on:
  push:
  pull_request:
  schedule:
    # Nightly: longer fuzzing, and a check against the corpus's live HEAD.
    - cron: "0 3 * * *"

permissions:
  contents: read

env:
  # The corpus is located as a sibling checkout; set it explicitly rather than
  # relying on the relative-path fallback in internal/conformance/corpus.go.
  IO_CORPUS_DIR: ${{ github.workspace }}/io-test-cases

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # so one script works on the Windows runner too
        working-directory: io-go
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.24", "stable"] # the go.mod floor, and current
    steps:
      - uses: actions/checkout@v4
        with:
          path: io-go
      - uses: actions/checkout@v4
        with:
          repository: maniartech/InternetObject-test-cases
          # The corpus repo is PRIVATE while this one is public, and a workflow's
          # default token can only read its own repository — so the checkout 404s
          # with no explanation. Set a CORPUS_TOKEN secret (a fine-grained PAT or
          # deploy key with read access to the corpus), or make the corpus public,
          # at which point this falls back to the default token and still works.
          token: ${{ secrets.CORPUS_TOKEN || github.token }}
          path: io-test-cases
          fetch-depth: 0 # the pinned commit may not be HEAD

      # The pin lives in ONE place — the source that reports it. Reading it here
      # rather than repeating the hash keeps that true.
      - name: Pin the corpus to the commit this port claims its numbers against
        run: |
          pin=$(sed -n 's/.*CorpusPin = "\([0-9a-f]*\)".*/\1/p' internal/conformance/corpus.go)
          test -n "$pin" || { echo "could not read CorpusPin"; exit 1; }
          echo "corpus pin: $pin"
          git -C "$IO_CORPUS_DIR" checkout --detach "$pin"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false # the module has zero external dependencies; there is no go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...

      # The corpus ladder (1,572 + 262) runs inside this. A missing corpus FAILS
      # the suite rather than skipping it, so a broken checkout cannot pass CI.
      - name: test
        run: go test ./...

      # Each fast path is an optimization of a general path that IS the
      # specification. These force the general routes, which is what makes the
      # differential tests meaningful.
      - name: test (general routes forced)
        run: |
          IO_NO_LAZY=1 go test -count=1 ./...
          IO_NO_FAST_PATH=1 go test -count=1 ./...
          IO_NO_HEADER_CACHE=1 go test -count=1 ./...

      - name: examples
        run: |
          for d in examples/*/; do
            echo "--- $d"
            go run "./$d" > /dev/null
          done

  race:
    name: race detector
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: io-go
    steps:
      - uses: actions/checkout@v4
        with:
          path: io-go
      - uses: actions/checkout@v4
        with:
          repository: maniartech/InternetObject-test-cases
          # The corpus repo is PRIVATE while this one is public, and a workflow's
          # default token can only read its own repository — so the checkout 404s
          # with no explanation. Set a CORPUS_TOKEN secret (a fine-grained PAT or
          # deploy key with read access to the corpus), or make the corpus public,
          # at which point this falls back to the default token and still works.
          token: ${{ secrets.CORPUS_TOKEN || github.token }}
          path: io-test-cases
          fetch-depth: 0
      - name: Pin the corpus
        run: |
          pin=$(sed -n 's/.*CorpusPin = "\([0-9a-f]*\)".*/\1/p' internal/conformance/corpus.go)
          test -n "$pin" || { echo "could not read CorpusPin"; exit 1; }
          git -C "$IO_CORPUS_DIR" checkout --detach "$pin"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: test -race
        run: go test -race -count=1 ./...

  fuzz:
    name: fuzz (${{ github.event_name == 'schedule' && '5m' || '45s' }} each)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: io-go
    steps:
      - uses: actions/checkout@v4
        with:
          path: io-go
      - uses: actions/checkout@v4
        with:
          repository: maniartech/InternetObject-test-cases
          # The corpus repo is PRIVATE while this one is public, and a workflow's
          # default token can only read its own repository — so the checkout 404s
          # with no explanation. Set a CORPUS_TOKEN secret (a fine-grained PAT or
          # deploy key with read access to the corpus), or make the corpus public,
          # at which point this falls back to the default token and still works.
          token: ${{ secrets.CORPUS_TOKEN || github.token }}
          path: io-test-cases
          fetch-depth: 0
      - name: Pin the corpus
        run: |
          pin=$(sed -n 's/.*CorpusPin = "\([0-9a-f]*\)".*/\1/p' internal/conformance/corpus.go)
          test -n "$pin" || { echo "could not read CorpusPin"; exit 1; }
          git -C "$IO_CORPUS_DIR" checkout --detach "$pin"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      # Short on every push (the committed seed corpora still run in full as
      # ordinary tests above); long nightly, where a real search happens.
      - name: fuzz
        run: |
          fuzztime=${{ github.event_name == 'schedule' && '5m' || '45s' }}
          fail=0
          # target:package — keep in step with `grep -rn '^func Fuzz' --include=*_test.go`
          for entry in \
            "FuzzParse:." \
            "FuzzStream:." \
            "FuzzFastPathMatchesTreePath:." \
            "FuzzLazyMatchesTreePath:." \
            "FuzzFramingAgreesWithParser:./internal/parser/" \
            "FuzzScannersMatchRegexes:./internal/document/" \
            "FuzzFastPathEqualsGeneral:./internal/numfmt/" ; do
            target=${entry%%:*}; pkg=${entry##*:}
            echo "--- $target ($pkg) for $fuzztime"
            go test -run XXX -fuzz "^${target}\$" -fuzztime="$fuzztime" "$pkg" || fail=1
          done
          exit $fail

      # A crasher is written to testdata/fuzz/<target>/; keep it so the failure
      # can be reproduced locally and committed as a regression seed.
      - name: Upload any crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: io-go/testdata/fuzz/
          if-no-files-found: ignore

  corpus-drift:
    # Nightly only. The push jobs pin the corpus for determinism, which means
    # they cannot notice upstream changing. This job is how we find out — and it
    # is expected to fail sometimes. That IS the signal.
    name: corpus drift (io-test-cases @ HEAD)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: io-go
    steps:
      - uses: actions/checkout@v4
        with:
          path: io-go
      - uses: actions/checkout@v4
        with:
          repository: maniartech/InternetObject-test-cases
          # The corpus repo is PRIVATE while this one is public, and a workflow's
          # default token can only read its own repository — so the checkout 404s
          # with no explanation. Set a CORPUS_TOKEN secret (a fine-grained PAT or
          # deploy key with read access to the corpus), or make the corpus public,
          # at which point this falls back to the default token and still works.
          token: ${{ secrets.CORPUS_TOKEN || github.token }}
          path: io-test-cases
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: test against the corpus's live HEAD
        run: go test -count=1 ./internal/conformance/...
